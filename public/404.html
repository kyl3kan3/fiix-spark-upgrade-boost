<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex,nofollow" />
    <title>Page not found | MaintenEase</title>
    <style>
      :root { color-scheme: light dark; font-family: Inter, ui-sans-serif, system-ui, sans-serif; }
      body { min-height: 100vh; margin: 0; display: grid; place-items: center; background: #f8f9ff; color: #172033; }
      main { width: min(32rem, calc(100% - 3rem)); padding: 2.5rem; border: 1px solid #dfe3ec; border-radius: .75rem; background: #fff; box-shadow: 0 16px 40px -24px #17203366; }
      p:first-child { margin: 0 0 .5rem; color: #00288e; font-size: .75rem; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; }
      h1 { margin: 0; font-size: clamp(2rem, 8vw, 4rem); line-height: 1; }
      p { line-height: 1.6; color: #596579; }
      a { display: inline-flex; min-height: 2.75rem; align-items: center; margin-top: .5rem; padding: 0 1rem; border-radius: .5rem; background: #00288e; color: #fff; font-weight: 700; text-decoration: none; }
      a:focus-visible { outline: 3px solid #0d9488; outline-offset: 3px; }
      @media (prefers-color-scheme: dark) {
        body { background: #111827; color: #f5f7fb; }
        main { border-color: #334155; background: #182234; }
        p { color: #c2cad7; }
        p:first-child { color: #6f91ff; }
      }
    </style>
  </head>
  <body>
    <main>
      <p>Error 404</p>
      <h1>Page not found</h1>
      <p>The page may have moved, been renamed, or never existed.</p>
      <a href="/">Return to MaintenEase</a>
    </main>
  </body>
</html>
